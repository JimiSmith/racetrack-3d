<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>racetrack-3d</title>
  </head>
  <body>
    <div id="app">
      <h1>racetrack-3d</h1>
      <div class="search-wrap">
        <input
          id="search-input"
          type="search"
          placeholder="Search for a racetrack…"
          autocomplete="off"
          spellcheck="false"
        />
        <ul id="search-results" hidden></ul>
      </div>
      <p id="status"></p>
      <div id="layout-wrap" class="layout-wrap" hidden>
        <label for="layout-select">Layout</label>
        <select id="layout-select"></select>
        <p id="layout-hint"></p>
      </div>
      <div class="actions">
        <button id="generate-stl" type="button" disabled>Generate STL</button>
      </div>
      <div id="preview" aria-label="3D preview"></div>
      <div id="exaggeration-wrap" hidden>
        <label id="exaggeration-label" for="exaggeration">Elevation exaggeration: 15×</label>
        <input id="exaggeration" type="range" min="1" max="50" value="15" step="1" />
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

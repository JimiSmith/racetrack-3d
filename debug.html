<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>racetrack-3d — Layout Debug</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      :root {
        --bg: #0b0d12;
        --surface: rgba(22, 26, 35, 0.88);
        --border: rgba(120, 137, 164, 0.2);
        --border-strong: rgba(120, 137, 164, 0.34);
        --text: #f2f4f8;
        --text-muted: #a4afc4;
        --text-soft: #7e889d;
        --accent: #ff234f;
        color-scheme: dark;
      }

      html, body {
        margin: 0;
        height: 100%;
        font: 14px/1.4 "Avenir Next", Montserrat, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }

      .header {
        grid-column: 1 / -1;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }

      .header h1 span {
        color: var(--text-muted);
        font-weight: 400;
      }

      #search-input {
        flex: 1;
        max-width: 400px;
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(14, 18, 25, 0.7);
        color: var(--text);
        font: inherit;
        font-size: 0.95rem;
        outline: none;
      }

      #search-input:focus {
        border-color: var(--accent);
      }

      #search-input::placeholder {
        color: var(--text-soft);
      }

      .search-wrap {
        position: relative;
        flex: 1;
        max-width: 400px;
      }

      #search-results {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        z-index: 1000;
        list-style: none;
        margin: 0;
        padding: 4px;
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        background: rgba(14, 18, 25, 0.97);
        display: none;
      }

      #search-results.open { display: block; }

      #search-results li {
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      #search-results li:hover {
        background: rgba(255, 35, 79, 0.12);
        color: var(--text);
      }

      .sidebar {
        overflow-y: auto;
        padding: 16px;
        border-right: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .sidebar h2 {
        margin: 0;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .toggle-row input[type="checkbox"] {
        accent-color: var(--accent);
      }

      #track-info {
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      #track-info .track-name {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 4px;
      }

      #way-list {
        flex: 1;
        overflow-y: auto;
      }

      .way-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-family: monospace;
        cursor: pointer;
        transition: background 0.15s;
      }

      .way-item:hover {
        background: rgba(255, 35, 79, 0.1);
      }

      .way-item .way-name {
        font-family: inherit;
        font-size: 0.78rem;
        color: var(--text-soft);
        margin-left: 8px;
      }

      .way-item .remove-btn {
        background: none;
        border: none;
        color: var(--text-soft);
        cursor: pointer;
        font-size: 1rem;
        padding: 0 4px;
      }

      .way-item .remove-btn:hover {
        color: var(--accent);
      }

      #copy-btn {
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(14, 18, 25, 0.7);
        color: var(--text);
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.15s;
      }

      #copy-btn:hover {
        border-color: var(--accent);
      }

      #copy-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .empty-state {
        color: var(--text-soft);
        font-size: 0.88rem;
        font-style: italic;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      #status-bar {
        font-size: 0.85rem;
        color: var(--text-soft);
        min-height: 1.2em;
      }

      #filter-panel {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      #filter-groups {
        display: flex;
        flex-direction: column;
      }

      .filter-group {
        border-bottom: 1px solid var(--border);
        padding: 6px 0;
      }

      .filter-group:last-child {
        border-bottom: none;
      }

      .filter-group-header {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--text-muted);
        padding: 2px 0;
        user-select: none;
      }

      .filter-chevron {
        font-size: 0.65rem;
        width: 12px;
        text-align: center;
        flex-shrink: 0;
      }

      .filter-key-name {
        flex: 1;
        font-weight: 600;
      }

      .filter-group-header .filter-count {
        color: var(--text-soft);
        font-size: 0.75rem;
      }

      .filter-toggle-all {
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text-soft);
        cursor: pointer;
        font-size: 0.7rem;
        padding: 1px 6px;
        line-height: 1.4;
      }

      .filter-toggle-all:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }

      .filter-group-body {
        padding: 4px 0 2px 18px;
      }

      .filter-group.collapsed .filter-group-body {
        display: none;
      }

      .filter-checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        color: var(--text-muted);
        padding: 1px 0;
        cursor: pointer;
      }

      .filter-checkbox input[type="checkbox"] {
        accent-color: var(--accent);
        margin: 0;
      }

      .filter-count {
        color: var(--text-soft);
        font-size: 0.75rem;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 0.82rem;
        color: var(--text-muted);
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .legend-swatch {
        width: 20px;
        height: 4px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="header">
        <h1>Layout Debug <span>— racetrack-3d</span></h1>
        <div class="search-wrap">
          <input id="search-input" type="text" placeholder="Search for a circuit..." autocomplete="off" />
          <ul id="search-results"></ul>
        </div>
      </div>

      <div class="sidebar">
        <div id="track-info">
          <p class="empty-state">Search for a circuit to begin.</p>
        </div>

        <div>
          <label class="toggle-row">
            <input type="checkbox" id="toggle-layouts" checked />
            Show track layouts
          </label>
        </div>

        <div id="status-bar"></div>

        <div id="filter-panel">
          <h2>Tag Filters</h2>
          <div id="filter-groups"></div>
        </div>

        <div class="legend">
          <div class="legend-item"><span class="legend-swatch" style="background:#888"></span> OSM way</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#ffaa00"></span> highway=raceway</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#44ddaa"></span> Relation member</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#ff234f"></span> Track layout</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#00ccff"></span> Selected way</div>
        </div>

        <h2>Selected Ways</h2>
        <div id="way-list">
          <p class="empty-state">Click ways on the map to select them.</p>
        </div>
        <button id="copy-btn" disabled>Copy Way IDs</button>
      </div>

      <div id="map"></div>
    </div>

    <script type="module" src="/src/debug/entry.ts"></script>
  </body>
</html>

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Restore geometry source cache
        uses: actions/cache@v4
        with:
          path: .cache/track-geometry/osm-api
          key: ${{ runner.os }}-track-geometry-${{ hashFiles('src/generated/track-search-index.json', 'scripts/build-track-geometry-index.mjs', 'scripts/lib/osm-api-source.mjs', 'src/search.js') }}
          restore-keys: |
            ${{ runner.os }}-track-geometry-

      - name: Rebuild geometry index
        run: npm run build:geometry-index:ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
